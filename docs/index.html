<head>

               font-family: Arial, sans-serif;

               padding: 5px;
               border-bottom: 1px solid #eee;

               color: #999;
               margin-right: 8px;
          }

          .username {
               font-weight: bold;
               color: #0077cc;
               margin-right: 5px;
          }
     </style>

</head>

<body>

     <h1>实时留言板</h1>

     <input id="usernameInput" type="text" placeholder="输入用户名..." />
     <br><br>
     <input id="msgInput" type="text" placeholder="输入留言..." />
     <button id="sendBtn">发送</button>

     <div id="messages"></div>

     <script type="module">


          // 🔹 引入 Firebase SDK
          import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
          import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

          // 🔹 替换成你自己的 Firebase 配置
          const firebaseConfig = {
               apiKey: "AIzaSyBUJ1YVVmS8h1SX4tNHRrK_MchjqUIWwjU",
               authDomain: "gentle-lace-fall.firebaseapp.com",
               databaseURL: "https://gentle-lace-fall-default-rtdb.asia-southeast1.firebasedatabase.app",
               projectId: "gentle-lace-fall",
               storageBucket: "gentle-lace-fall.firebasestorage.app",
               messagingSenderId: "354328807137",
               appId: "1:354328807137:web:d808545cd047b92d5659a0"
          }

          // 🔹 初始化 Firebase
          const app = initializeApp(firebaseConfig);
          const db = getDatabase(app);

          // 🔹 获取 DOM 元素
          const usernameInput = document.getElementById("usernameInput");
          const msgInput = document.getElementById("msgInput");
          const sendBtn = document.getElementById("sendBtn");
          const messagesDiv = document.getElementById("messages");

          // 🔹 格式化时间函数
          function formatTime(ts) {
               const date = new Date(ts);
               const h = date.getHours().toString().padStart(2, "0");
               const m = date.getMinutes().toString().padStart(2, "0");
               return `${h}:${m}`;
          }

          // 🔹 发送留言函数
          function sendMessage() {
               const username = usernameInput.value.trim() || "匿名";
               const text = msgInput.value.trim();
               if (text) {
                    push(ref(db, "messages"), {
                         username: username,
                         text: text,
                         time: Date.now()
                    });
                    msgInput.value = "";
               }
          }

          // 🔹 点击按钮发送
          sendBtn.onclick = sendMessage;

          // 🔹 按 Enter 发送
          msgInput.addEventListener("keydown", (e) => {
               if (e.key === "Enter") {
                    e.preventDefault(); // 防止换行
                    sendMessage();
               }
          });

          // // 🔹 实时监听留言
          const messagesRef = ref(db, "messages");
          onChildAdded(messagesRef, (snapshot) => {
               const data = snapshot.val();
               const div = document.createElement("div");
               div.className = "msg";

               const timeSpan = document.createElement("span");
               timeSpan.className = "time";
               timeSpan.textContent = `[${formatTime(data.time)}]`;

               const nameSpan = document.createElement("span");
               nameSpan.className = "username";
               nameSpan.textContent = data.username + "：";

               const textSpan = document.createElement("span");
               textSpan.textContent = data.text;

               div.appendChild(timeSpan);
               div.appendChild(nameSpan);
               div.appendChild(textSpan);
               messagesDiv.appendChild(div);
          });
     </script>
</body>

</html>
